name: Website

# Deploy the download site (website/) to Cloudflare Pages on every push that
# touches it. Serves at https://sysible.pages.dev (add a custom domain later in
# the Cloudflare dashboard). One-time setup: create a Cloudflare API token with
# the "Cloudflare Pages: Edit" permission and add two repo secrets —
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see website/README.md).
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'sysiblesoftware/Sysible-Linux'
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare secrets
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare secrets not set — skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see website/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create the Pages project on first run (idempotent — ignore "exists").
          npx --yes wrangler@3 pages project create sysible \
            --production-branch=main 2>/dev/null || echo "Pages project 'sysible' already exists — continuing."
          # Deploy the static site directory as a production deployment.
          npx --yes wrangler@3 pages deploy website \
            --project-name=sysible --branch=main --commit-dirty=true
