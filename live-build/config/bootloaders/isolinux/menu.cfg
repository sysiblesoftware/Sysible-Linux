# Render the background at 800x600 (crisp on VMs/most firmware) so splash.png,
# authored at 800x600, isn't upscaled and soft.
menu resolution 800 600
menu hshift 0
menu width 82
# The Sysible logo + wordmark occupy the TOP ~44% of splash.png (art ends at
# ~y=265 of 600). At 800x600 a text row is 16px tall (37 rows), so keep the menu
# title + entries below row ~21 (y>=336) — firmly in the clear lower band, so
# boot text never overlaps the artwork. Status/help lines sit at the very bottom.
menu vshift 23
menu rows 6
menu titlerow 21
menu tabmsgrow 34
menu cmdlinerow 34
menu helpmsgrow 35
menu helpmsgendrow 36

menu title Sysible Linux
include stdmenu.cfg
include live.cfg
include install.cfg
menu end
